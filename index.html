<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bread.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Roti Bahagia — roti rumahan dibuat fresh setiap hari dengan bahan pilihan. Pesan mudah lewat WhatsApp."
    />
    <meta name="theme-color" content="#F7F0E1" />

    <!-- Fonts: Caprasimo (display playful) + Caveat (script) + Nunito Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Font dimuat tanpa memblokir tampilan.

      Sebuah <link rel="stylesheet"> biasa menghentikan peramban: tidak ada
      satu piksel pun digambar sebelum berkas font selesai diunduh dari server
      Google. Di jaringan seluler Indonesia jeda itu sering satu sampai dua
      detik, dan selama itu pengunjung menatap layar kosong.

      Trik media="print" membuat peramban mengunduhnya sebagai gaya cetak —
      yang tidak memblokir tampilan — lalu onload mengubahnya menjadi gaya
      layar begitu berkasnya siap. Halaman tampil lebih dulu dengan font
      cadangan, lalu berganti mulus. <noscript> menjaga font tetap dimuat
      untuk peramban yang JavaScript-nya dimatikan.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Caveat:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Caveat:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Roti Bahagia — Roti Rumahan Dibuat dengan Cinta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
